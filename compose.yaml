name: victoria

services:
  victoria:
    build: .
    environment:
      VICTORIA_ADDRESS: "0.0.0.0"
      VICTORIA_PORT: "5001"
      VICTORIA_DATABASE_URL: "postgresql://${DB_USER}:${DB_PASS}@database:5432/db"
    ports:
      - "11435:5001"
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started

  database:
    image: postgres:18
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASS}"
      POSTGRES_DB: "db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - data:/var/lib/postgresql/18/data

  ollama:
    image: ollama/ollama:0.21.2
    tty: true
    volumes:
      - ollama:/root/.ollama

volumes:
  data: {}
  ollama: {}
